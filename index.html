<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyer SafeRoute - UNICID</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .flyer {
            width: 380px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            text-align: center;
            border: 2px solid #0056b3;
        }
        .header {
            background: linear-gradient(135deg, #0056b3, #002d62);
            color: white;
            padding: 30px 20px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }
        .content {
            padding: 25px 20px;
        }
        .icons {
            font-size: 24px;
            margin-bottom: 15px;
        }
        .message {
            font-size: 15px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .qr-container {
            background: #f8f9fa;
            border: 3px dashed #0056b3;
            border-radius: 15px;
            padding: 15px;
            display: inline-block;
            margin-bottom: 15px;
            transition: transform 0.2s ease;
        }
        .qr-container:hover {
            transform: scale(1.02);
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            display: block;
        }
        .btn-link {
            display: block;
            background-color: #0056b3;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 12px 20px;
            border-radius: 10px;
            margin: 15px 0 20px 0;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.25);
        }
        .btn-link:hover {
            background-color: #003d80;
            transform: translateY(-2px);
        }
        .call-to-action {
            font-weight: bold;
            color: #0056b3;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0 10px;
        }
        .footer {
            background: #e9ecef;
            padding: 12px;
            font-size: 12px;
            color: #6c757d;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="flyer">
    <div class="header">
        <h1>Projeto SafeRoute</h1>
        <p>UNICID Tatuapé</p>
    </div>
    
    <div class="content">
        <div class="icons">🚶‍♂️ 🚌 🚆 🚇</div>
        
        <p class="message">
            Seja você <strong>pedestre</strong> ou usuário de <strong>ônibus, trem e metrô</strong>, sua resposta leva menos de 2 minutos e fortalece nosso projeto acadêmico!
        </p>

        <!-- QR Code como link clicável -->
        <a href="https://docs.google.com/forms/d/1UuRu_kzfygSa4jCEV5y-TaUGt3qZXHtqzr4aMo5Twy4/edit" target="_blank" class="qr-container" title="Clique para abrir o formulário">
            <img src="Design%20sem%20nome.png" alt="QR Code SafeRoute">
        </a>

        <!-- Botão direto para o formulário -->
        <a href="https://docs.google.com/forms/d/1UuRu_kzfygSa4jCEV5y-TaUGt3qZXHtqzr4aMo5Twy4/edit" target="_blank" class="btn-link">
            📝 Responder Formulário Direto
        </a>

        <p class="call-to-action">
            Aponte a câmera ou clique no botão acima!
        </p>
    </div>

    <div class="footer">
        Pesquisa Acadêmica | ADS - UNICID
    </div>
</div>

</body>
</html>
